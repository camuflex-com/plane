name: Deploy self-hosted

# Construye las imágenes de este fork, las publica en ECR y las despliega en la
# instancia EC2 self-hosted vía SSM.
#
# La autenticación con AWS es por OIDC: no hay llaves de acceso ni llave SSH
# guardadas en GitHub. El rol solo puede empujar a los 6 repos de ECR y mandar
# un SendCommand a esa única instancia.
#
# Variables de repositorio requeridas (Settings > Secrets and variables >
# Actions > Variables). Ver deployments/camuflex/README.md.
#   AWS_REGION          us-east-1
#   AWS_DEPLOY_ROLE_ARN arn:aws:iam::<cuenta>:role/plane-github-actions-deploy
#   ECR_REGISTRY        <cuenta>.dkr.ecr.us-east-1.amazonaws.com
#   EC2_INSTANCE_ID     i-xxxxxxxxxxxxxxxxx
#   HEALTH_HOST         plane.camuflex.com

on:
  push:
    branches: [preview]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag ya existente en ECR a desplegar (vacío = construir desde el commit actual)"
        required: false
        type: string

# Nunca cancelar un despliegue a medias: podría interrumpir una migración.
concurrency:
  group: deploy-selfhost
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  setup:
    name: Resolver tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      needs_build: ${{ steps.tag.outputs.needs_build }}
    steps:
      - id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            # El prefijo sha- lo consume la lifecycle policy de ECR.
            echo "image_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.image }}
    needs: setup
    if: needs.setup.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: plane-frontend
            context: .
            dockerfile: apps/web/Dockerfile.web
          - image: plane-space
            context: .
            dockerfile: apps/space/Dockerfile.space
          - image: plane-admin
            context: .
            dockerfile: apps/admin/Dockerfile.admin
          - image: plane-live
            context: .
            dockerfile: apps/live/Dockerfile.live
          - image: plane-backend
            context: apps/api
            dockerfile: apps/api/Dockerfile.api
          - image: plane-proxy
            context: apps/proxy
            dockerfile: apps/proxy/Dockerfile.ce
    steps:
      - uses: actions/checkout@v5

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login en ECR
        run: |
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ vars.ECR_REGISTRY }}"

      - uses: docker/setup-buildx-action@v4

      - name: Build y push
        uses: docker/build-push-action@v7.0.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # La instancia es x86_64; construir solo amd64 acorta el pipeline.
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ matrix.image }}:${{ needs.setup.outputs.image_tag }}
            ${{ vars.ECR_REGISTRY }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Desplegar en EC2
    needs: [setup, build]
    # Corre también cuando se salta el build (despliegue de un tag existente).
    if: always() && needs.setup.result == 'success' && needs.build.result != 'failure' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Enviar despliegue por SSM
        id: send
        env:
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          HEALTH_HOST: ${{ vars.HEALTH_HOST }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -Eeuo pipefail

          # Los archivos viajan en base64 dentro del propio comando SSM, así la
          # instancia corre siempre exactamente lo que hay en este commit y no
          # hace falta darle acceso al repositorio.
          COMPOSE_B64=$(base64 -w0 deployments/cli/community/docker-compose.yml)
          OVERLAY_B64=$(base64 -w0 deployments/camuflex/docker-compose.ecr.yml)
          DEPLOY_B64=$(base64 -w0 deployments/camuflex/deploy.sh)

          jq -n \
            --arg compose "$COMPOSE_B64" \
            --arg overlay "$OVERLAY_B64" \
            --arg deploy  "$DEPLOY_B64" \
            --arg tag     "$IMAGE_TAG" \
            --arg reg     "$ECR_REGISTRY" \
            --arg host    "$HEALTH_HOST" \
            --arg region  "$AWS_REGION" \
            '{
              commands: [
                "set -eu",
                "cd /opt/plane-app",
                ("echo \($compose) | base64 -d > docker-compose.yaml"),
                ("echo \($overlay) | base64 -d > docker-compose.ecr.yml"),
                ("echo \($deploy)  | base64 -d > deploy.sh"),
                "chmod +x deploy.sh",
                ("ECR_REGISTRY=\($reg) HEALTH_HOST=\($host) AWS_REGION=\($region) bash ./deploy.sh \($tag)")
              ],
              executionTimeout: ["3600"]
            }' > /tmp/ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $IMAGE_TAG desde GitHub Actions" \
            --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' --output text)

          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM CommandId: $CMD_ID"

      - name: Esperar resultado
        env:
          CMD_ID: ${{ steps.send.outputs.command_id }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail

          # SSM tarda un instante en materializar la invocación.
          sleep 5

          STATUS=Pending
          for _ in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 15
          done

          echo "::group::Salida del despliegue"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text || true
          echo "::endgroup::"

          ERR=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text || true)
          if [ -n "$ERR" ] && [ "$ERR" != "None" ]; then
            echo "::group::stderr"
            echo "$ERR"
            echo "::endgroup::"
          fi

          echo "Estado final: $STATUS"
          [ "$STATUS" = "Success" ]
